[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradual-agi"
version = "1.0.0"
description = "Reference implementations of the calculations in On Gradual AGI (Chapters 5, 6 and 9)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "W.H.L." }]
requires-python = ">=3.9"

[tool.setuptools]
packages = ["gradual_agi"]
