site_name: On Gradual AGI
site_description: "A framework for AGI as a gradual, ongoing transformation: the Multi-Plateau Framework and the Unified Gradual AGI Model."
site_author: W.H.L.
site_url: https://champaignmagazine.github.io/on-gradual-agi/
repo_url: https://github.com/champaignmagazine/on-gradual-agi
repo_name: champaignmagazine/on-gradual-agi
edit_uri: ""
copyright: "Copyright © 2026 W.H.L. · Champaign Magazine · Licensed under CC BY 4.0"

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/book.css

nav:
  - Home: index.md
  - Front matter:
      - Copyright and License: copyright.md
      - Preface: preface.md
      - Contributors and AI Collaboration: contributors.md
      - About the Author: about-the-author.md
      - Notation Quick Reference: notation-quick-reference.md
      - Reader Guide: reader-guide.md
  - "Part I. Orientation":
      - "1. AGI and the Meaning of Gradual Transformation": chapter-01.md
      - "2. AGI-Inclusive Humanity": chapter-02.md
  - "Part II. Architecture":
      - "3. A Multi-Plateau Framework": chapter-03.md
      - "4. From Potential to Realization": chapter-04.md
      - "5. Synchronization: Ceiling, Floor, and Slope": chapter-05.md
      - "6. Optimization: Choosing Among Trajectories": chapter-06.md
  - "Part III. Mediation":
      - "7. Governance: Contesting Realization": chapter-07.md
      - "8. Participation: Subjects, Acts, and Consequences": chapter-08.md
      - "9. Participation: What Survives Empirical Contact": chapter-09.md
      - "10. Observation, Evidence, and Epistemic Discipline": chapter-10.md
      - "11. Feedback, Recursion, and Ongoing Transformation": chapter-11.md
  - "Part IV. Integration":
      - "12. The Unified Gradual AGI Model": chapter-12.md
      - Glossary: glossary.md
      - Full Notation Guide: notation-guide.md
      - Claims and Status Register: claims-and-status-register.md
      - Revision Record: revision-record.md
      - Unified References: references.md
